name: Data Platform House feedback
description: Save an idea, question, confusion point, or improvement for the Data Platform House when it should outlive an agent conversation.
title: "Data Platform House input: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape the Data Platform House.

        Most feedback can be given through an agent conversation first. Use this
        form when the input should be saved, shared, or tracked outside the
        conversation. Agents may also use it as the durable record for useful
        public-safe feedback.

        This issue is public. Please do not include private images, secrets,
        personal data, or internal details that should not be visible outside
        the intended audience.

  - type: dropdown
    id: feedback_kind
    attributes:
      label: What kind of input is this?
      options:
        - Idea for the game
        - Something confusing
        - Missing data platform concept
        - Character or dialogue input
        - GitHub repository input
        - Event or presentation idea
        - Bug or broken page behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What did you try, notice, or imagine?
      description: Describe the moment in the experience, the concept, or the scene you are reacting to.
      placeholder: "Example: I wanted to follow a scheduled export, but I could not tell which pipe was scheduled."
    validations:
      required: true

  - type: textarea
    id: better_outcome
    attributes:
      label: What would make it better?
      description: Explain what should be clearer, more fun, more accurate, or more useful.
      placeholder: "Example: The scheduled pipe could pulse once per day and have a clock beside the valve."
    validations:
      required: true

  - type: dropdown
    id: route_area
    attributes:
      label: Which route or page is this about?
      description: Pick the closest public page so agents can find the right context quickly.
      options:
        - The Three.js world at /data-platform-example/
        - The instructions and backlog at /data-platform-example/instructions/
        - A character knowledge page under /data-platform-example/characters/
        - The feedback form or backlog process itself
        - More than one route
    validations:
      required: true

  - type: dropdown
    id: house_area
    attributes:
      label: Which house area or topic is closest?
      description: Pick the nearest scene area, service zone, or concept focus.
      options:
        - Product team source and intake
        - Ingestion and storage landing
        - Databricks and Spark-style processing
        - dbt-style modeling and trust shaping
        - Declared export path
        - Product return, Dataverse, or Datafront
        - Configuration service catalog
        - Character dialogue or knowledge
        - General world navigation or camera movement
        - Backlog or instructions wording
    validations:
      required: true

  - type: dropdown
    id: payment_step
    attributes:
      label: Which payment journey step is closest?
      description: Pick the nearest handoff even if your idea affects more than one step.
      options:
        - Step 1: Product team sends a payment signal
        - Step 2: Ingestion lands in storage
        - Step 3: Quality gates and modeling shape trust
        - Step 4: Exports leave by declaration
        - Step 5: Product teams receive trusted outputs
        - More than one step
        - Not about the payment journey
    validations:
      required: true

  - type: checkboxes
    id: flow_modes
    attributes:
      label: Which flow modes are involved?
      description: Select any modes that are relevant, even if you are asking for a new visual cue.
      options:
        - label: Streaming
        - label: Incremental checkpointing
        - label: Quality gate
        - label: Declared export
        - label: Serving flow
        - label: Scheduled batch
        - label: Reviewed full refresh
        - label: Backfill or replay
        - label: Manual correction
        - label: No specific flow mode

  - type: textarea
    id: repository_context
    attributes:
      label: Repository or artifact context
      description: Add public GitHub repositories, local personal repository paths, or safe artifact names if they help ground the idea.
      placeholder: "Example: isakrs/modern-data-platform-example, isakrs/vipps-isakrs, or a public-safe note about a service or room."

  - type: textarea
    id: safe_references
    attributes:
      label: Safe references or artifacts
      description: Add public-safe links, file paths, or notes that can help. Leave this empty if there are none.
      placeholder: "Example: A public GitHub repository link, a public demo, a local personal repository path, or a high-level description."

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This input does not include secrets, private images, or sensitive internal details.
          required: true
