  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { --vipps: #ff5b24; --ink: #fff7ec; --muted: #b9afa2; --line: rgba(255,255,255,.16); --panel: #12110f; }
    html { background: #050505; }
    body { min-height: 100dvh; margin: 0; color: var(--ink); background: radial-gradient(circle at 18% 10%, rgba(255,91,36,.26), transparent 26rem), #050505; font-family: "Inter", sans-serif; overflow-x: hidden; }
    .shell { width: min(1380px, calc(100% - 24px)); margin: 0 auto; padding: 14px 0 18px; }
    .topbar { min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .brand { min-width: 0; display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
    .brand img { width: 38px; height: 38px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,91,36,.36); flex: 0 0 auto; }
    .brand strong { display: block; font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1; font-weight: 900; overflow-wrap: anywhere; }
    .brand span { display: block; margin-top: 3px; color: var(--muted); font-size: .78rem; font-weight: 800; }
    .actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .button { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255,91,36,.58); border-radius: 8px; background: var(--vipps); color: #170802; padding: 0 13px; font-size: .84rem; font-weight: 900; text-decoration: none; cursor: pointer; }
    .button.ghost { border-color: var(--line); background: rgba(255,255,255,.08); color: var(--ink); }
    .button:disabled { opacity: .42; cursor: default; }
    .stage { display: grid; gap: 10px; }
    .frame { display: grid; place-items: center; min-height: min(70dvh, 780px); border: 1px solid var(--line); border-radius: 8px; background: #000; overflow: hidden; box-shadow: 0 22px 90px rgba(0,0,0,.5); }
    .slide { width: 100%; height: auto; max-height: min(70dvh, 780px); display: block; object-fit: contain; }
    .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
    .control-group { display: flex; gap: 8px; }
    .control-group:last-child { justify-content: flex-end; }
    .counter { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(241,200,91,.42); border-radius: 999px; background: rgba(241,200,91,.1); color: #f1c85b; padding: 0 13px; font-size: .86rem; font-weight: 900; white-space: nowrap; }
    .thumbs { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(82px, 10vw, 144px); gap: 8px; overflow-x: auto; padding: 4px 0 10px; scrollbar-color: var(--vipps) transparent; }
    .thumb { aspect-ratio: 16 / 9; border: 2px solid transparent; border-radius: 6px; padding: 0; background: #111; overflow: hidden; cursor: pointer; opacity: .58; }
    .thumb.active { border-color: var(--vipps); opacity: 1; }
    .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
    @media (max-width: 700px) {
      .shell { width: min(100% - 18px, 1380px); padding-top: 10px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .actions { width: 100%; justify-content: flex-start; }
      .button { flex: 1 1 auto; }
      .frame { min-height: auto; }
      .slide { max-height: 58dvh; }
      .controls { grid-template-columns: 1fr; }
      .control-group, .control-group:last-child { justify-content: stretch; }
      .control-group .button { flex: 1; }
      .counter { justify-self: center; }
    }
  </style>
