<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
  <title>Vipps Millionaire</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --background: #090908;
      --panel: #151411;
      --ink: #fff7ec;
      --muted: #b9afa2;
      --line: rgba(255, 255, 255, 0.13);
      --vipps: #ff5b24;
      --gold: #f1c85b;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    body {
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at 18% 15%, rgba(255, 91, 36, 0.32), transparent 28rem),
        linear-gradient(135deg, #090908 0%, #17120e 48%, #050505 100%);
      color: var(--ink);
      font-family: "Inter", sans-serif;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 38px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      margin-bottom: clamp(22px, 5vw, 48px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255, 91, 36, 0.36);
      flex: 0 0 auto;
    }

    .brand strong {
      display: block;
      font-size: 1.35rem;
      line-height: 1;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .pill {
      border: 1px solid rgba(241, 200, 91, 0.45);
      border-radius: 999px;
      color: var(--gold);
      background: rgba(241, 200, 91, 0.1);
      padding: 9px 13px;
      font-size: 0.82rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: clamp(20px, 5vw, 54px);
      align-items: end;
      margin-bottom: clamp(22px, 5vw, 48px);
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(3.2rem, 12vw, 8.7rem);
      line-height: 0.88;
      font-weight: 950;
      letter-spacing: 0;
    }

    .hero-visual {
      min-height: clamp(220px, 34vw, 420px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #030303;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .hero-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      min-height: 300px;
      display: grid;
      align-content: end;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, transparent 30%, rgba(0, 0, 0, 0.88) 100%);
    }

    .card[href]:hover {
      border-color: rgba(255, 91, 36, 0.75);
      transform: translateY(-2px);
    }

    .card img {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.82;
    }

    .card-content {
      padding: clamp(18px, 4vw, 28px);
    }

    .card-kicker {
      display: inline-flex;
      width: fit-content;
      border-radius: 999px;
      background: rgba(255, 91, 36, 0.92);
      color: #170802;
      padding: 7px 10px;
      font-size: 0.74rem;
      font-weight: 950;
      text-transform: uppercase;
    }

    .card.muted .card-kicker {
      background: rgba(241, 200, 91, 0.92);
    }

    .card h2 {
      max-width: 520px;
      margin: 12px 0 0;
      font-size: clamp(1.75rem, 4vw, 3.4rem);
      line-height: 0.95;
      font-weight: 950;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .card p {
      margin: 10px 0 0;
      color: rgba(255, 247, 236, 0.78);
      font-size: 0.98rem;
      font-weight: 800;
      line-height: 1.25;
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 22px, 1180px);
        padding-top: 16px;
      }

      .topbar,
      .hero {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero {
        gap: 18px;
      }

      .hero-visual {
        min-height: 220px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 250px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="2026-04-16/assets/vipps-smile.gif" alt="Vipps smile" />
        <div>
          <strong>Vipps Millionaire</strong>
          <span>Game collection</span>
        </div>
      </div>
      <div class="pill">4 cards</div>
    </header>

    <section class="hero" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Vipps Millionaire</h1>
      <div class="hero-visual" aria-hidden="true">
        <img src="2026-04-16/assets/images/rules-shots.webp" alt="" />
      </div>
    </section>

    <section class="cards" aria-label="Vipps Millionaire cards">
      <a class="card" href="/millionaire/2026-04-16/">
        <img src="2026-04-16/assets/images/q01-reward-one.webp" alt="" />
        <div class="card-content">
          <span class="card-kicker">Live game</span>
          <h2>Aarhus</h2>
          <p>16 April 2026</p>
        </div>
      </a>

      <a class="card" href="/millionaire/2026-04-16/?studio=1">
        <img src="2026-04-16/assets/images/q02-developers.webp" alt="" />
        <div class="card-content">
          <span class="card-kicker">Studio</span>
          <h2>Make questions</h2>
          <p>Photos and fun slides</p>
        </div>
      </a>

      <article class="card muted">
        <img src="2026-04-16/assets/images/q14-party.webp" alt="" />
        <div class="card-content">
          <span class="card-kicker">PowerPoint</span>
          <h2>Aarhus social</h2>
          <p>2025</p>
        </div>
      </article>

      <article class="card muted">
        <img src="2026-04-16/assets/images/q06-interlude-party.webp" alt="" />
        <div class="card-content">
          <span class="card-kicker">PowerPoint</span>
          <h2>Summer party</h2>
          <p>Vipps Millionaire</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
