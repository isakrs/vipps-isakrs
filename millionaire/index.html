<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
  <title>Vipps Millionaire</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --background: #090908;
      --panel: #151411;
      --ink: #fff7ec;
      --muted: #b9afa2;
      --line: rgba(255, 255, 255, 0.13);
      --vipps: #ff5b24;
      --gold: #f1c85b;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    body {
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at 18% 15%, rgba(255, 91, 36, 0.32), transparent 28rem),
        linear-gradient(135deg, #090908 0%, #17120e 48%, #050505 100%);
      color: var(--ink);
      font-family: "Inter", sans-serif;
    }

    .shell {
      width: min(1240px, calc(100% - 28px));
      margin: 0 auto;
      padding: 26px 0 38px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      margin-bottom: clamp(22px, 5vw, 48px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255, 91, 36, 0.36);
      flex: 0 0 auto;
    }

    .brand strong {
      display: block;
      font-size: 1.35rem;
      line-height: 1;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(241, 200, 91, 0.45);
      border-radius: 999px;
      color: var(--gold);
      background: rgba(241, 200, 91, 0.1);
      padding: 7px 11px;
      font-size: 0.9rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .pill img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .hero {
      display: grid;
      gap: clamp(16px, 3vw, 28px);
      margin-bottom: clamp(22px, 5vw, 48px);
    }

    h1 {
      max-width: 100%;
      margin: 0;
      font-size: clamp(2.9rem, 8.8vw, 7rem);
      line-height: 0.93;
      font-weight: 950;
      letter-spacing: 0;
    }

    h1 span {
      display: inline;
    }

    .hero-visual {
      height: clamp(230px, 28vw, 380px);
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) repeat(2, minmax(0, 0.7fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #030303;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .hero-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
    }

    .hero-visual img:first-child {
      grid-row: 1 / -1;
      object-position: center;
    }

    .hero-visual img:nth-child(3) {
      object-position: center top;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      min-height: clamp(270px, 34vw, 430px);
      display: grid;
      align-content: end;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, transparent 30%, rgba(0, 0, 0, 0.88) 100%);
    }

    .card[href]:hover {
      border-color: rgba(255, 91, 36, 0.75);
      transform: translateY(-2px);
    }

    .card img {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.82;
    }

    .card-content {
      padding: clamp(16px, 3vw, 24px);
    }

    .card-kicker {
      display: inline-flex;
      width: fit-content;
      border-radius: 999px;
      background: rgba(255, 91, 36, 0.92);
      color: #170802;
      padding: 7px 10px;
      font-size: 0.72rem;
      font-weight: 950;
      text-transform: uppercase;
    }

    .card.muted .card-kicker {
      background: rgba(241, 200, 91, 0.92);
    }

    .card.pending {
      opacity: 0.72;
    }

    .card.pending::after {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.26) 15%, rgba(0, 0, 0, 0.92) 100%);
    }

    .card h2 {
      max-width: 520px;
      margin: 12px 0 0;
      font-size: clamp(1.65rem, 3vw, 3rem);
      line-height: 0.95;
      font-weight: 950;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .card-meta {
      margin-top: 10px;
      color: rgba(255, 247, 236, 0.78);
      font-size: 0.82rem;
      font-weight: 800;
    }

    @media (max-width: 1040px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 22px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero {
        gap: 18px;
      }

      .hero-visual {
        height: 360px;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1.35fr 1fr 1fr;
      }

      .hero-visual img:first-child {
        grid-column: 1 / -1;
        grid-row: auto;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 250px;
      }

      h1 span {
        display: block;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="2026-04-16/assets/vipps-smile.gif" alt="Vipps smile" />
        <div>
          <strong>Vipps Millionaire</strong>
          <span>Game collection</span>
        </div>
      </div>
      <div class="pill" aria-label="3 published Vipps Millionaire presentations">
        <img src="2026-04-16/assets/images/shot-icon.png" alt="" />
        <span>3</span>
      </div>
    </header>

    <section class="hero" aria-labelledby="pageTitle">
      <h1 id="pageTitle"><span>Vipps</span> <span>Millionaire</span></h1>
      <div class="hero-visual" aria-hidden="true">
        <img src="2026-04-16/assets/images/rules-shots.webp" alt="" />
        <img src="2026-04-16/assets/images/oslo-2026-card.jpg" alt="" />
        <img src="2026-04-16/assets/images/q14-party.webp" alt="" />
        <img src="2026-04-16/assets/images/q06-interlude-party.webp" alt="" />
        <img src="2026-04-16/assets/images/q02-developers.webp" alt="" />
      </div>
    </section>

    <section class="cards" aria-label="Vipps Millionaire cards">
      <a class="card" href="/millionaire/aarhus-2026/">
        <img src="2026-04-16/assets/images/q01-reward-one.webp" alt="" />
        <div class="card-content">
          <span class="card-kicker">16 April 2026</span>
          <h2>Aarhus</h2>
          <div class="card-meta">165 slides</div>
        </div>
      </a>

      <article class="card muted pending">
        <img src="2026-04-16/assets/images/oslo-2026-card.jpg" alt="" />
        <div class="card-content">
          <span class="card-kicker">24 April 2026</span>
          <h2>Oslo</h2>
          <div class="card-meta">Missing source deck</div>
        </div>
      </article>

      <a class="card" href="/millionaire/aarhus-social-2025/">
        <img src="aarhus-social-2025/slides/slide-004.jpg" alt="" />
        <div class="card-content">
          <span class="card-kicker">4 April 2025</span>
          <h2>Aarhus social</h2>
          <div class="card-meta">173 slides</div>
        </div>
      </a>

      <a class="card" href="/millionaire/summer-party-2025/">
        <img src="summer-party-2025/slides/slide-004.jpg" alt="" />
        <div class="card-content">
          <span class="card-kicker">13 June 2025</span>
          <h2>Summer party</h2>
          <div class="card-meta">164 slides</div>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
