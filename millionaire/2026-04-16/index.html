<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
  <title>Vipps Millionaire | 16 April 2026</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --background: #080807;
      --panel: #151513;
      --panel-strong: #211f1a;
      --ink: #fff9ed;
      --muted: #b9b0a1;
      --line: #3a352e;
      --vipps: #ff5b24;
      --gold: #e4bd5a;
      --green: #35d07f;
      --red: #ff6868;
      --blue: #182b76;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 91, 36, 0.24), transparent 26rem),
        linear-gradient(135deg, #080807 0%, #18140e 45%, #050506 100%);
      color: var(--ink);
      font-family: "Inter", sans-serif;
    }

    button {
      font: inherit;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 32px;
    }

    body.slide-active .shell {
      width: 100%;
      min-height: 100dvh;
      padding: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 54px;
      margin-bottom: 16px;
    }

    body.slide-active .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      min-height: 0;
      margin: 0;
      padding: 24px clamp(18px, 6vw, 96px);
      background: linear-gradient(180deg, rgba(5, 5, 5, 0.72), transparent);
      pointer-events: none;
    }

    body.slide-active .brand,
    body.slide-active .top-actions {
      pointer-events: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255, 91, 36, 0.32);
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.05;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 3px;
    }

    .status-pill {
      border: 1px solid rgba(228, 189, 90, 0.45);
      color: var(--gold);
      background: rgba(228, 189, 90, 0.1);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .sound-toggle {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }

    .sound-toggle[aria-pressed="true"] {
      color: #170802;
      background: var(--gold);
      border-color: var(--gold);
    }

    .sound-toggle.icon-button {
      width: 46px;
      min-width: 46px;
      padding: 8px;
      display: inline-grid;
      place-items: center;
    }

    .game {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      gap: 16px;
      align-items: stretch;
    }

    .game[hidden],
    .full-slide[hidden],
    .slide-media[hidden],
    .slide-rules[hidden],
    .drink-grid[hidden],
    .slide-actions[hidden] {
      display: none;
    }

    .full-slide {
      position: relative;
      min-height: calc(100dvh - 126px);
      display: grid;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 8px;
      background: #050505;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    body.slide-active .full-slide {
      min-height: 100dvh;
      border: 0;
      border-radius: 0;
    }

    .full-slide.choice-slide {
      min-height: min(760px, calc(100dvh - 126px));
      align-items: center;
      padding: clamp(24px, 5vw, 58px);
      background:
        linear-gradient(145deg, rgba(255, 91, 36, 0.28), transparent 42%),
        linear-gradient(180deg, rgba(28, 26, 21, 0.98), rgba(7, 7, 6, 0.98));
    }

    body.slide-active .full-slide.choice-slide {
      min-height: 100dvh;
      padding: clamp(112px, 18vh, 160px) clamp(22px, 8vw, 120px) clamp(36px, 8vh, 76px);
    }

    .seat-slide .slide-copy {
      align-self: end;
      padding: clamp(112px, 18vh, 150px) clamp(24px, 8vw, 110px) clamp(36px, 7vh, 80px);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.9);
    }

    .seat-slide .slide-copy h2 {
      font-size: clamp(2.2rem, 5vw, 4.6rem);
    }

    .seat-slide .slide-copy h2:empty {
      display: none;
    }

    .seat-slide .slide-copy p,
    .seat-slide .slide-rules {
      display: none;
    }

    .seat-slide .drink-grid {
      width: min(720px, 100%);
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-top: 18px;
    }

    .seat-slide .drink-option {
      min-height: 84px;
      display: grid;
      place-items: center;
      background: rgba(5, 5, 5, 0.7);
      text-align: center;
    }

    .seat-slide .drink-option .drink-icon {
      width: clamp(52px, 6vw, 84px);
      height: clamp(52px, 6vw, 84px);
    }

    .slide-media {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(var(--slide-columns, 1), minmax(0, 1fr));
      gap: clamp(8px, 1.4vw, 16px);
      padding: clamp(10px, 2vw, 22px);
      background: #050505;
    }

    .slide-media.media-count-1 {
      padding: 0;
    }

    .slide-media.media-count-2 {
      --slide-columns: 2;
    }

    .slide-media.media-count-3 {
      --slide-columns: 3;
    }

    .slide-media.media-count-4 {
      --slide-columns: 4;
    }

    .slide-media-item {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #050505;
    }

    .slide-media-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .slide-media-item.fit-cover img {
      object-fit: cover;
    }

    .slide-media-item.transparent img {
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 88%;
      padding: clamp(12px, 3vw, 36px);
    }

    .slide-copy {
      position: relative;
      z-index: 1;
      align-self: end;
      width: min(960px, 100%);
      padding: clamp(22px, 4vw, 42px);
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.82);
    }

    body.slide-active .interlude-slide .slide-copy {
      padding: clamp(112px, 18vh, 150px) clamp(24px, 8vw, 110px) clamp(36px, 7vh, 80px);
    }

    .choice-slide .slide-copy,
    .summary-slide .slide-copy {
      align-self: center;
      padding: 0;
      text-shadow: none;
    }

    .slide-kicker {
      color: var(--gold);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .slide-copy h2 {
      margin: 8px 0 0;
      font-size: clamp(2rem, 6vw, 5.8rem);
      line-height: 0.95;
      font-weight: 950;
      overflow-wrap: anywhere;
    }

    .slide-copy p {
      max-width: 760px;
      margin: 14px 0 0;
      color: rgba(255, 249, 237, 0.84);
      font-size: clamp(1rem, 2vw, 1.34rem);
      font-weight: 760;
      line-height: 1.28;
      overflow-wrap: anywhere;
    }

    .slide-rules {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 24px;
    }

    .rule-tile {
      min-height: 134px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 14px;
    }

    .rule-tile strong {
      display: block;
      color: var(--ink);
      font-size: 0.96rem;
      line-height: 1.08;
      font-weight: 900;
    }

    .rule-tile > span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 720;
      line-height: 1.25;
    }

    .drink-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 22px;
    }

    .drink-option {
      min-height: 86px;
      border: 1px solid rgba(228, 189, 90, 0.32);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.07);
      padding: 14px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }

    .drink-option:hover {
      transform: translateY(-1px);
      border-color: var(--vipps);
      background: rgba(255, 91, 36, 0.15);
    }

    .drink-icon {
      width: 54px;
      height: 54px;
      display: inline-grid;
      place-items: center;
      color: var(--gold);
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.32));
    }

    .drink-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4;
    }

    .drink-icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .drink-icon .drink-fill {
      fill: currentColor;
      stroke: none;
      opacity: 0.18;
    }

    .drink-icon.water {
      color: #8dd7ff;
    }

    .drink-icon.beer {
      color: #f1c85b;
    }

    .drink-icon.wine {
      color: #ff7a8a;
    }

    .drink-icon.liquor {
      color: #d99a4a;
    }

    .drink-icon.status {
      width: 32px;
      height: 32px;
      margin-left: 5px;
      vertical-align: middle;
    }

    .drink-message {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .drink-message .drink-icon {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
    }

    .slide-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .slide-actions .control-button {
      min-height: 48px;
      padding: 12px 16px;
      font-size: 0.94rem;
    }

    .stage,
    .ladder {
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: linear-gradient(180deg, rgba(27, 26, 23, 0.95), rgba(10, 10, 9, 0.95));
      box-shadow: var(--shadow);
      border-radius: 8px;
    }

    .stage {
      min-height: 690px;
      display: grid;
      grid-template-rows: auto minmax(170px, 1fr) auto auto;
      overflow: hidden;
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.025);
    }

    .meter {
      width: min(360px, 44%);
      min-width: 170px;
      align-self: center;
    }

    .meter-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--vipps), var(--gold));
      border-radius: inherit;
      transition: width 0.24s ease;
    }

    .kicker {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .stage-main {
      position: relative;
      display: grid;
      place-items: center;
      padding: 28px 18px 20px;
      isolation: isolate;
      min-height: 330px;
    }

    .stage-main::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(228, 189, 90, 0.22);
      border-radius: 50%;
      transform: rotate(-4deg);
      z-index: -1;
    }

    .stage-main::after {
      content: "";
      position: absolute;
      width: min(44vw, 430px);
      aspect-ratio: 1;
      border: 2px dashed rgba(255, 91, 36, 0.2);
      border-radius: 50%;
      z-index: -1;
    }

    .emblem {
      width: min(320px, 60vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        linear-gradient(135deg, rgba(255, 91, 36, 0.9), rgba(228, 189, 90, 0.92)),
        #ff5b24;
      box-shadow:
        inset 0 0 0 12px rgba(8, 8, 7, 0.62),
        inset 0 0 0 15px rgba(255, 255, 255, 0.2),
        0 20px 70px rgba(255, 91, 36, 0.26);
    }

    .emblem-inner {
      width: 72%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #080807;
      border: 1px solid rgba(255, 255, 255, 0.16);
      text-align: center;
      padding: 20px;
    }

    .emblem-word {
      display: block;
      font-size: 1.6rem;
      line-height: 0.95;
      font-weight: 900;
      text-transform: uppercase;
    }

    .emblem-small {
      display: block;
      margin-top: 8px;
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .media-board {
      width: min(100%, 820px);
      display: grid;
      grid-template-columns: repeat(var(--media-columns, 1), minmax(0, 1fr));
      gap: 12px;
      align-items: center;
      justify-items: center;
    }

    .media-board.media-count-3 {
      --media-columns: 3;
    }

    .media-board.media-count-4 {
      --media-columns: 4;
    }

    .media-board.media-count-2 {
      --media-columns: 2;
    }

    .media-item {
      width: 100%;
      min-height: 160px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(228, 189, 90, 0.2);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 91, 36, 0.1), rgba(228, 189, 90, 0.06)),
        rgba(255, 255, 255, 0.045);
      overflow: hidden;
    }

    .media-board.media-count-1 .media-item {
      min-height: 280px;
    }

    .media-item img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 360px;
      object-fit: contain;
    }

    .media-item.fit-cover img {
      object-fit: cover;
    }

    .media-item.transparent img {
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 300px;
      padding: 12px;
    }

    .question-wrap {
      padding: 0 18px 18px;
    }

    .question {
      min-height: 84px;
      display: grid;
      align-items: center;
      padding: 20px 24px;
      border: 1px solid rgba(228, 189, 90, 0.36);
      border-radius: 8px;
      background: linear-gradient(180deg, #172765, #07133f);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      text-align: center;
      font-size: 1.45rem;
      font-weight: 850;
      line-height: 1.18;
      overflow-wrap: anywhere;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 0 18px 18px;
    }

    .answer {
      min-height: 68px;
      padding: 14px 18px;
      border: 1px solid rgba(228, 189, 90, 0.4);
      border-radius: 8px;
      color: var(--ink);
      background: linear-gradient(180deg, #182b76, #081748);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      text-align: left;
      font-weight: 800;
      line-height: 1.16;
      cursor: pointer;
      overflow-wrap: anywhere;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--gold);
    }

    .answer:disabled {
      cursor: default;
      opacity: 0.74;
    }

    .answer.hidden-answer {
      color: transparent;
      text-shadow: none;
      border-color: rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.045);
    }

    .answer.removed {
      color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
      text-decoration: line-through;
    }

    .answer.selected {
      border-color: var(--gold);
      background: linear-gradient(180deg, #72541a, #332004);
    }

    .answer.locked {
      border-color: var(--vipps);
      background: linear-gradient(180deg, #8f3517, #43190b);
    }

    .answer.correct {
      color: #06150d;
      border-color: rgba(53, 208, 127, 0.85);
      background: linear-gradient(180deg, #45e18d, #1eb869);
    }

    .answer.wrong {
      border-color: rgba(255, 104, 104, 0.85);
      background: linear-gradient(180deg, #8d2424, #430909);
    }

    .answers.interlude {
      display: none;
    }

    .question.interlude-title {
      background: linear-gradient(180deg, #4c2415, #1b0d08);
      border-color: rgba(255, 91, 36, 0.5);
    }

    .control-strip {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px 18px 18px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.025);
    }

    .actions,
    .lifelines {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-button,
    .lifeline {
      min-height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel-strong);
      padding: 9px 12px;
      font-size: 0.86rem;
      font-weight: 850;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.14s ease;
    }

    .control-button:hover:not(:disabled),
    .lifeline:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--vipps);
    }

    .control-button.primary {
      background: var(--vipps);
      border-color: var(--vipps);
      color: #170802;
    }

    .control-button:disabled,
    .lifeline:disabled {
      cursor: default;
      opacity: 0.46;
    }

    .lifeline.used {
      color: var(--muted);
      position: relative;
    }

    .lifeline.used::after {
      content: "";
      position: absolute;
      left: 9px;
      right: 9px;
      top: 50%;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transform: rotate(-24deg);
    }

    .icon-button {
      width: 44px;
      min-width: 44px;
      aspect-ratio: 1;
      display: inline-grid;
      place-items: center;
      padding: 9px;
    }

    .control-button.shot-action {
      width: auto;
      min-width: 44px;
      padding-inline: 10px;
    }

    .ui-icon {
      width: 22px;
      height: 22px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .lifeline .ui-icon {
      width: 24px;
      height: 24px;
    }

    .button-badge {
      position: absolute;
      right: -5px;
      bottom: -6px;
      min-width: 17px;
      height: 17px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(255, 249, 237, 0.26);
      border-radius: 999px;
      color: #170802;
      background: var(--gold);
      font-size: 0.66rem;
      font-weight: 950;
    }

    .slide-actions .control-button.icon-button {
      width: 52px;
      min-width: 52px;
      padding: 12px;
    }

    .message {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
      min-height: 1.4em;
      overflow-wrap: anywhere;
    }

    .rule-card,
    .rule-visual {
      min-width: 0;
    }

    .rule-visual {
      display: grid;
      gap: 7px;
    }

    .rule-visual.compact {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
    }

    .rule-line {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .rule-sign {
      width: 18px;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1;
      font-weight: 950;
      text-align: center;
    }

    .rule-line.reward .rule-sign {
      color: var(--green);
    }

    function formatRoundLabel() {

    function currentDrinkName() {
      return state.currentDrink || "chosen option";

    function drinkKey(drink) {
      return String(drink || "").toLowerCase().replace(/[^a-z0-9-]+/g, "-");
    }

    function drinkIconMarkup(drink, className = "") {
      const label = drinkIcons[drink] ? drink : currentDrinkName();
      const icon = drinkIcons[drink] || drinkIcons.Water;
      return `<span class="drink-icon ${drinkKey(label)} ${className}" role="img" aria-label="${label}">${icon}</span>`;
    }

    function hotSeatDrinkMarkup() {
      if (!state.currentDrink) return `Player ${state.playerNumber}`;
      return `Player ${state.playerNumber} · ${drinkIconMarkup(state.currentDrink, "status")}`;
    }

    function setStatusMessage(message, drink = "") {
      state.message = message;
      state.messageDrink = drink;
    }

    function renderStatusText(element, message, drink = "") {
      element.textContent = "";

      if (!drink) {
        element.textContent = message;
        return;
      }

      const wrapper = document.createElement("span");
      wrapper.className = "drink-message";
      wrapper.innerHTML = drinkIconMarkup(drink);
      wrapper.appendChild(document.createTextNode(message));
      element.appendChild(wrapper);
    }

    function handoutShotCount() {
      return state.seatQuestionNumber * 2;
    }

    function getRule(questionNumber = state.seatQuestionNumber) {
      return hotSeatRules[Math.min(Math.max(questionNumber, 1), hotSeatRules.length) - 1];
    }

    function currentRuleText(questionNumber = state.seatQuestionNumber) {
      const rule = getRule(questionNumber);

      if (rule.rewardShots === "all") {
        return `${rule.title}: ${stakeLabel(rule.rewardShots)} if correct, ${stakeLabel(rule.penaltyShots)} if wrong`;
      }

      return `${rule.title}: give ${stakeLabel(rule.rewardShots)} if correct, ${stakeLabel(rule.penaltyShots)} if wrong`;
    }

    function shotLabel(count) {
      const iconCount = count === "all" ? 9 : Number(count);
      return count === "all" ? "shots for everyone" : `${iconCount} shot${iconCount === 1 ? "" : "s"}`;
    }

    function shotIconMarkup(count, className = "") {
      const iconCount = count === "all" ? 9 : Number(count);
      const label = shotLabel(count);
      const icons = Array.from({ length: iconCount }, () => `<img src="${shotIconSource}" alt="" />`).join("");
      return `<span class="shot-strip ${className}" role="img" aria-label="${label}">${icons}</span>`;
    }

    function stakeUnitLabel() {
      if (state.currentDrink === "Water") return "water";
      if (state.currentDrink === "Beer") return "beer";
      if (state.currentDrink === "Wine") return "wine";
      if (state.currentDrink === "Liquor") return "shot";
      return "shot";
    }

    function pluralizedStakeUnit(count) {
      const unit = stakeUnitLabel();
      if (unit === "water" || unit === "wine") return unit;
      return count === 1 ? unit : `${unit}s`;
    }

    function stakeLabel(count) {
      if (!state.currentDrink) return shotLabel(count);
      if (count === "all") return `${pluralizedStakeUnit(2)} for everyone`;
      const iconCount = Number(count);
      return `${iconCount} ${pluralizedStakeUnit(iconCount)}`;
    }

    function stakeIconMarkup(count, className = "") {
      if (!state.currentDrink) return shotIconMarkup(count, className);

      const iconCount = count === "all" ? 9 : Number(count);
      const label = stakeLabel(count);
      const icons = Array.from({ length: iconCount }, () => drinkIconMarkup(state.currentDrink, "stake")).join("");
      return `<span class="shot-strip ${className}" role="img" aria-label="${label}">${icons}</span>`;
    }

    function ruleVisualMarkup(questionNumber = state.seatQuestionNumber, variant = "") {
      const rule = getRule(questionNumber);
      const rewardLabel = rule.rewardShots === "all" ? `${stakeLabel(rule.rewardShots)} if correct` : `give ${stakeLabel(rule.rewardShots)} if correct`;
      const penaltyLabel = `${stakeLabel(rule.penaltyShots)} if wrong`;

      return `
        <span class="rule-visual ${variant}" aria-label="${currentRuleText(questionNumber)}">
          <span class="rule-line reward" aria-label="${rewardLabel}">
            <span class="rule-sign" aria-hidden="true">+</span>
            ${stakeIconMarkup(rule.rewardShots)}
          </span>
          <span class="rule-line penalty" aria-label="${penaltyLabel}">
            <span class="rule-sign" aria-hidden="true">-</span>
            ${stakeIconMarkup(rule.penaltyShots)}
          </span>
        </span>
      `;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function setIconButton(button, iconName, label, options = {}) {
      const badge = options.badge ? `<span class="button-badge" aria-hidden="true">${escapeHtml(options.badge)}</span>` : "";
      button.classList.add("icon-button");
      button.classList.remove("shot-action");
      button.innerHTML = `<span class="button-content">${uiIcons[iconName] || ""}${badge}</span>`;
      button.setAttribute("aria-label", label);
      button.title = label;
    }

    function setShotButton(button, label, count) {
      const actionIcon = label === "Give" ? uiIcons.give : label === "Everyone" ? uiIcons.users : "";
      const spokenLabel = label ? `${label} ${stakeLabel(count)}` : stakeLabel(count);
      button.classList.remove("icon-button");
      button.classList.add("shot-action");
      button.innerHTML = `<span class="button-content">${actionIcon}${stakeIconMarkup(count)}</span>`;
      button.setAttribute("aria-label", spokenLabel);
      button.title = spokenLabel;
    }

    function nextButtonIcon(label) {
      if (label === "Finish") return "finish";
      if (label === "Play on") return "play";

    function renderStatusMessage() {
      if (state.message) {
        renderStatusText(elements.message, state.message, state.messageDrink);

      elements.message.innerHTML = ruleVisualMarkup(state.seatQuestionNumber, "compact");

    function getPendingTransitionLabel() {
      if (state.pendingTransition === "playOn") return "Next";
      if (state.questionIndex >= activeQuestions.length - 1) return "Finish";
      return "Next";
    }

    function render() {
      const question = activeQuestions[state.questionIndex];
      const isSlide = state.mode === "seat" || state.mode === "interlude" || state.mode === "summary";

      if (question) {
        preloadQuestionMedia(question);
        if (activeQuestions[state.questionIndex + 1]) preloadQuestionMedia(activeQuestions[state.questionIndex + 1]);
      }

      renderSoundToggle();
      document.body.classList.toggle("slide-active", isSlide);
      elements.game.hidden = isSlide;
      elements.slideStage.hidden = !isSlide;

      if (isSlide) {
        renderSlide(question);
        return;
      }

      const progress = ((state.questionIndex + 1) / activeQuestions.length) * 100;
      elements.statusPill.textContent = `Question ${state.questionIndex + 1} of ${activeQuestions.length}`;
      elements.roundLabel.textContent = formatRoundLabel();
      renderStatusMessage();
      elements.meterFill.style.width = `${progress}%`;
      elements.questionText.textContent = question.question;
      elements.questionText.classList.remove("interlude-title");
      elements.answers.classList.remove("interlude");
      elements.currentPrizeLabel.textContent = "Current Rule";
      elements.currentPrize.innerHTML = ruleVisualMarkup(state.seatQuestionNumber);
      elements.correctLabel.textContent = "Hot Seat";
      elements.correctCount.innerHTML = hotSeatDrinkMarkup();

      renderMedia(question);
      elements.answers.innerHTML = "";

      question.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        const isRevealed = index < state.revealedAnswers;
        const isRemoved = state.removedAnswers.has(index);
        button.type = "button";
        button.className = "answer";
        button.textContent = isRevealed ? `${letters[index]}. ${answer}` : `${letters[index]}.`;
        button.disabled = !isRevealed || isRemoved || state.answerShown;
        button.setAttribute("aria-pressed", state.selectedAnswer === index ? "true" : "false");

        if (!isRevealed) button.classList.add("hidden-answer");
        if (isRemoved) button.classList.add("removed");
        if (state.selectedAnswer === index) button.classList.add("selected");
        if (state.lockedAnswer === index) button.classList.add("locked");
        if (state.answerShown && index === question.correct) button.classList.add("correct");
        if (state.answerShown && state.lockedAnswer === index && index !== question.correct) button.classList.add("wrong");

        button.addEventListener("click", () => selectAnswer(index));
        elements.answers.appendChild(button);
      });

      renderPrizes();
      renderControls();
      renderLifelines();
    }

    function renderSlide(question) {
      elements.slideStage.className = state.mode === "seat"
        ? "full-slide seat-slide"
        : state.mode === "interlude"
          ? "full-slide interlude-slide"
          : `full-slide choice-slide ${state.mode}-slide`;
      elements.slideRules.innerHTML = "";
      elements.drinkChoices.innerHTML = "";
      elements.slideActions.innerHTML = "";

      if (state.mode === "seat") {
        renderSeatSlide();
        return;
      }

      if (state.mode === "summary") {
        renderSummarySlide();
        return;
      }

      renderInterludeSlide(question);
    }

    function renderSeatSlide() {
      elements.statusPill.textContent = `Hot seat ${state.playerNumber}`;
      renderSlideMedia(ruleSlideMedia);
      elements.slideRules.hidden = true;
      elements.drinkChoices.hidden = false;
      elements.slideActions.hidden = true;
      elements.slideKicker.textContent = `Player ${state.playerNumber}`;
      elements.slideTitle.textContent = "";
      elements.slideMessage.textContent = "";

      hotSeatRules.forEach((rule, index) => {
        const tile = document.createElement("div");
        tile.className = "rule-tile";
        tile.innerHTML = `<strong>${rule.title}</strong><span>${ruleVisualMarkup(index + 1)}</span>`;
        elements.slideRules.appendChild(tile);
      });

      drinkOptions.forEach((drink) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "drink-option";
        button.setAttribute("aria-label", drink);
        button.innerHTML = `${drinkIconMarkup(drink)}<span class="visually-hidden">${drink}</span>`;
        button.addEventListener("click", () => selectDrink(drink));
        elements.drinkChoices.appendChild(button);
      });
    }

    function renderInterludeSlide(question) {
      const media = getInterludeMedia(question);
      elements.statusPill.textContent = `Fun slide ${state.questionIndex + 1} of ${activeQuestions.length}`;
      elements.slideRules.hidden = true;
      elements.drinkChoices.hidden = true;
      elements.slideActions.hidden = false;
      renderSlideMedia(media);

      elements.slideKicker.textContent = state.pendingTransition === "playOn" ? "Between questions" : "Between players";
      elements.slideTitle.textContent = question.interludeTitle || "Bonus Content";
      elements.slideMessage.textContent = question.interludeCaption || getInterludeMessage();

      const nextButton = createSlideButton(getPendingTransitionLabel(), true);
      nextButton.addEventListener("click", completePendingTransition);
      elements.slideActions.appendChild(nextButton);
    }

    function renderSummarySlide() {
      elements.statusPill.textContent = "Game complete";
      elements.slideMedia.hidden = true;
      elements.slideRules.hidden = true;
      elements.drinkChoices.hidden = true;
      elements.slideActions.hidden = false;
      elements.slideKicker.textContent = "Last question";
      elements.slideTitle.textContent = "Game over";
      elements.slideMessage.textContent = `${state.correctAnswers} / ${activeQuestions.length}`;

      const resetButton = createSlideButton("Reset game", true);
      resetButton.addEventListener("click", resetGame);
      elements.slideActions.appendChild(resetButton);
    }

    function renderSlideMedia(media) {
      const mediaItems = media?.length ? media : [];
      elements.slideMedia.hidden = false;
      elements.slideMedia.className = `slide-media media-count-${Math.min(mediaItems.length || 1, 4)}`;
      elements.slideMedia.innerHTML = "";

      if (!mediaItems.length) {
        elements.slideMedia.hidden = true;
        return;
      }

      mediaItems.forEach((item) => {
        const wrapper = document.createElement("div");
        wrapper.className = "slide-media-item";
        if (item.fit) wrapper.classList.add(item.fit);

        const imageElement = document.createElement("img");
        imageElement.src = item.src;
        imageElement.alt = item.alt;
        imageElement.loading = "eager";
        imageElement.decoding = "async";

        wrapper.appendChild(imageElement);
        elements.slideMedia.appendChild(wrapper);
      });
    }

    function createSlideButton(label, primary = false) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = primary ? "control-button primary" : "control-button";
      const iconName = label === "Reset game" ? "reset" : nextButtonIcon(label);
      setIconButton(button, iconName, label);
      return button;
    }

    function getInterludeMessage() {
      if (state.pendingTransition === "playOn") {
        return "";
      }

      if (state.questionIndex >= activeQuestions.length - 1) {
        return "";
      }

      return "";
    }

    function renderMedia(question) {
      const media = state.mode === "interlude" ? getInterludeMedia(question) : question.promptMedia;
      const mediaItems = media?.length ? media : [];

      elements.mediaBoard.className = `media-board media-count-${Math.min(mediaItems.length || 1, 4)}`;
      elements.mediaBoard.innerHTML = "";

      if (!mediaItems.length) {
        elements.mediaBoard.innerHTML = `
          <div class="emblem" aria-hidden="true">
            <div class="emblem-inner">
              <span class="emblem-word">Vipps</span>
              <span class="emblem-word">Millionaire</span>
              <span class="emblem-small">Data and Insights</span>
            </div>
          </div>
        `;
        return;
      }

      mediaItems.forEach((item) => {
        const wrapper = document.createElement("div");
        wrapper.className = "media-item";
        if (item.fit) wrapper.classList.add(item.fit);

        const imageElement = document.createElement("img");
        imageElement.src = item.src;
        imageElement.alt = item.alt;
        imageElement.loading = "eager";
        imageElement.decoding = "async";

        wrapper.appendChild(imageElement);
        elements.mediaBoard.appendChild(wrapper);
      });
    }

    function preloadQuestionMedia(question) {
      [...(question.promptMedia || []), ...getInterludeMedia(question)].forEach((item) => {
        if (preloadedImages.has(item.src)) return;
        const imageElement = new Image();
        imageElement.onload = () => loadedImages.add(item.src);
        imageElement.src = item.src;
        if (imageElement.complete && imageElement.naturalWidth > 0) loadedImages.add(item.src);
        preloadedImages.add(item.src);
      });
    }

    function waitForImage(source) {
      if (!source || loadedImages.has(source)) return Promise.resolve();

      return new Promise((resolve) => {
        const imageElement = new Image();
        const finish = () => {
          if (imageElement.naturalWidth > 0) loadedImages.add(source);
          resolve();
        };

        imageElement.onload = finish;
        imageElement.onerror = finish;
        imageElement.src = source;
        if (imageElement.complete) finish();
        window.setTimeout(resolve, 2500);
      });
    }

    function waitForMedia(media) {
      return Promise.all((media || []).map((item) => waitForImage(item.src)));
    }

    function renderPrizes() {
      elements.prizes.innerHTML = "";
      hotSeatRules.forEach((rule, index) => {
        const item = document.createElement("li");
        item.className = "prize";
        if (index + 1 === state.seatQuestionNumber) item.classList.add("current");
        if (index + 1 < state.seatQuestionNumber) item.classList.add("cleared");
        if (index + 1 === maxSeatQuestions) item.classList.add("safe");
        item.innerHTML = `<span>${index + 1}</span><span>${ruleVisualMarkup(index + 1, "ladder")}</span>`;
        elements.prizes.appendChild(item);
      });
    }

    function renderControls() {
      const allAnswersRevealed = state.revealedAnswers >= 4;
      setIconButton(elements.resetButton, "reset", "Reset game");
      elements.revealButton.disabled = allAnswersRevealed || state.answerShown;
      setIconButton(
        elements.revealButton,
        allAnswersRevealed || state.answerShown ? "check" : "eye",
        allAnswersRevealed || state.answerShown ? "All options revealed" : `Reveal ${letters[state.revealedAnswers]}`,
        allAnswersRevealed || state.answerShown ? {} : { badge: letters[state.revealedAnswers] }
      );
      elements.lockButton.disabled = state.selectedAnswer === null || state.answerShown;
      setIconButton(elements.lockButton, state.lockedAnswer === null ? "lock" : "check", state.lockedAnswer === null ? "Lock answer" : "Answer locked");

      if (!state.answerShown) {
        elements.answerButton.disabled = !allAnswersRevealed;
        setIconButton(elements.answerButton, "answer", "Show answer");
        elements.nextButton.disabled = true;
        setIconButton(elements.nextButton, "next", "Next");
        return;
      }

      setIconButton(elements.revealButton, "check", "Answer shown");
      elements.lockButton.disabled = true;
      elements.answerButton.disabled = false;
      elements.nextButton.disabled = false;

      if (state.lockedAnswer === null) {
        elements.answerButton.disabled = true;
        setIconButton(elements.answerButton, "lockOff", "No answer locked");
        const nextLabel = state.questionIndex === activeQuestions.length - 1 ? "Finish" : "Next";
        setIconButton(elements.nextButton, nextButtonIcon(nextLabel), nextLabel);
        return;
      }

      if (!state.answerCorrect) {
        setShotButton(elements.answerButton, "", state.seatQuestionNumber);
        const nextLabel = state.questionIndex === activeQuestions.length - 1 ? "Finish" : "Next";
        setIconButton(elements.nextButton, nextButtonIcon(nextLabel), nextLabel);
        return;
      }

      if (state.seatQuestionNumber >= maxSeatQuestions) {
        setShotButton(elements.answerButton, "Everyone", "all");
        const nextLabel = state.questionIndex === activeQuestions.length - 1 ? "Finish" : "Next";
        setIconButton(elements.nextButton, nextButtonIcon(nextLabel), nextLabel);
        return;
      }

      setShotButton(elements.answerButton, "Give", handoutShotCount());
      const nextLabel = state.questionIndex === activeQuestions.length - 1 ? "Finish" : "Play on";
      setIconButton(elements.nextButton, nextButtonIcon(nextLabel), nextLabel);
    }

    function renderLifelines() {
      setIconButton(elements.fiftyButton, "fifty", "Fifty fifty");
      setIconButton(elements.audienceButton, "audience", "Audience poll");
      setIconButton(elements.phoneButton, "phone", "Phone helper");
      const lifelinesDisabled = state.mode === "interlude" || state.answerShown;
      elements.fiftyButton.disabled = state.usedLifelines.has("fifty") || lifelinesDisabled;
      elements.audienceButton.disabled = state.usedLifelines.has("audience") || lifelinesDisabled;
      elements.phoneButton.disabled = state.usedLifelines.has("phone") || lifelinesDisabled;
      elements.fiftyButton.classList.toggle("used", state.usedLifelines.has("fifty"));
      elements.audienceButton.classList.toggle("used", state.usedLifelines.has("audience"));
      elements.phoneButton.classList.toggle("used", state.usedLifelines.has("phone"));
    }

    function renderSoundToggle() {
      setIconButton(elements.soundButton, state.soundEnabled ? "volumeOn" : "volume", state.soundEnabled ? "Sound on" : "Enable sound");
      elements.soundButton.setAttribute("aria-pressed", state.soundEnabled ? "true" : "false");
    }

    function playSound(name, options = {}) {
      if (!state.soundEnabled || !sounds[name]) return;

      const sound = sounds[name];
      sound.loop = Boolean(options.loop);
      if (options.restart !== false) {
        sound.pause();
        sound.currentTime = 0;
      }
      sound.play().catch(() => {});
    }

    function stopSound(name) {
      if (!sounds[name]) return;
      sounds[name].pause();
      sounds[name].currentTime = 0;
    }

    function stopRoundSounds() {
      stopSound("thinking");
      stopSound("celebration");
      stopSound("reveal");
      stopSound("lifeline");
      stopSound("question");
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      if (state.soundEnabled) {
        playSound("theme");
      } else {
        Object.values(sounds).forEach((sound) => {
          sound.pause();
          sound.currentTime = 0;
        });
      }
      renderSoundToggle();
    }

    function selectAnswer(index) {
      if (state.mode !== "question" || state.removedAnswers.has(index) || state.answerShown || index >= state.revealedAnswers) return;
      state.selectedAnswer = index;
      state.lockedAnswer = null;
      setStatusMessage(`${letters[index]} selected`);
      render();
    }

    function revealOption() {
      if (state.mode !== "question" || state.revealedAnswers >= 4 || state.answerShown) return;
      state.revealedAnswers += 1;
      setStatusMessage(state.revealedAnswers === 4 ? "All options are on the board." : `${letters[state.revealedAnswers - 1]} revealed.`);
      if (state.revealedAnswers === 1) playSound("question");
      if (state.revealedAnswers === 4) playSound("thinking");
      render();
    }

    function lockAnswer() {
      if (state.mode !== "question" || state.selectedAnswer === null || state.answerShown) return;
      state.lockedAnswer = state.selectedAnswer;
      setStatusMessage(`${letters[state.lockedAnswer]} locked.`);
      render();
    }

    function selectDrink(drink) {
      state.currentDrink = drink;
      state.mode = "question";
      setStatusMessage("selected for this hot seat.", drink);
      state.usedLifelines.clear();
      resetQuestionState();
      playSound("question");
      render();
    }

    function showAnswer() {
      const question = activeQuestions[state.questionIndex];
      if (state.mode !== "question" || state.answerShown) return;
      stopSound("thinking");
      playSound("reveal");
      state.revealedAnswers = 4;
      state.answerShown = true;
      state.answerCorrect = state.lockedAnswer === question.correct;

      if (state.answerCorrect && !state.awardedQuestions.has(state.questionIndex)) {
        state.correctAnswers += 1;
        state.awardedQuestions.add(state.questionIndex);
      }

      if (state.lockedAnswer === null) {
        setStatusMessage(`Answer: ${letters[question.correct]}`);
      } else if (state.answerCorrect) {
        setStatusMessage("Correct");
        window.setTimeout(() => playSound("celebration"), 320);
      } else {
        setStatusMessage("Wrong");
      }

      render();
    }

    function handleAnswerButton() {
      if (state.mode !== "question") return;
      if (!state.answerShown) {
        showAnswer();
        return;
      }

      if (state.lockedAnswer === null) return;
      resolveOutcome("newPlayer");
    }

    async function nextQuestion() {
      if (state.mode === "interlude") {
        await completePendingTransition();
        return;
      }

      if (state.mode !== "question" || !state.answerShown) return;

      if (state.lockedAnswer === null || !state.answerCorrect || state.seatQuestionNumber >= maxSeatQuestions || state.questionIndex >= activeQuestions.length - 1) {
        await resolveOutcome("newPlayer");
        return;
      }

      await resolveOutcome("playOn");
    }

    async function resolveOutcome(transition) {
      if (state.mode !== "question" || !state.answerShown) return;
      stopRoundSounds();

      const canPlayOn = transition === "playOn"
        && state.answerCorrect
        && state.seatQuestionNumber < maxSeatQuestions
        && state.questionIndex < activeQuestions.length - 1;
      state.pendingTransition = canPlayOn ? "playOn" : "newPlayer";

      const interludeMedia = getInterludeMedia(activeQuestions[state.questionIndex]);
      if (interludeMedia.length > 0) {
        setStatusMessage("Loading fun slide.");
        render();
        await waitForMedia(interludeMedia);
        state.mode = "interlude";
        setStatusMessage("");
        playSound("celebration");
        render();
        return;
      }

      await completePendingTransition();
    }

    async function completePendingTransition() {
      const transition = state.pendingTransition || "newPlayer";
      state.pendingTransition = null;

      if (state.questionIndex >= activeQuestions.length - 1) {
        state.mode = "summary";
        setStatusMessage("");
        render();
        return;
      }

      const next = activeQuestions[state.questionIndex + 1];
      if (next) await waitForMedia(next.promptMedia || []);

      state.questionIndex += 1;
      resetQuestionState();

      if (transition === "playOn" && state.seatQuestionNumber < maxSeatQuestions) {
        state.seatQuestionNumber += 1;
        state.mode = "question";
        setStatusMessage("stays", state.currentDrink);
        playSound("question");
      } else {
        state.playerNumber += 1;
        state.seatQuestionNumber = 1;
        state.currentDrink = "";
        state.usedLifelines.clear();
        state.mode = "seat";
        setStatusMessage("");
      }

      render();
    }

    function resetGame() {
      stopRoundSounds();
      state.questionIndex = 0;
      state.mode = "seat";
      state.playerNumber = 1;
      state.seatQuestionNumber = 1;
      state.currentDrink = "";
      state.pendingTransition = null;
      resetQuestionState();
      state.correctAnswers = 0;
      state.awardedQuestions.clear();
      state.usedLifelines.clear();
      setStatusMessage("");
      render();
    }

    function useFiftyFifty() {
      if (state.mode !== "question" || state.usedLifelines.has("fifty") || state.answerShown) return;
      const correct = activeQuestions[state.questionIndex].correct;
      const wrongAnswers = [0, 1, 2, 3].filter((index) => index !== correct);
      state.revealedAnswers = 4;
      state.removedAnswers = new Set(wrongAnswers.slice(0, 2));
      if (state.removedAnswers.has(state.selectedAnswer)) {
        state.selectedAnswer = null;
        state.lockedAnswer = null;
      }
      state.usedLifelines.add("fifty");
      setStatusMessage("Two wrong answers removed.");
      playSound("lifeline");
      render();
    }

    function useAudience() {
      if (state.mode !== "question" || state.usedLifelines.has("audience") || state.answerShown) return;
      const correct = activeQuestions[state.questionIndex].correct;
      const correctShare = 48 + ((state.questionIndex * 7) % 18);
      const remaining = 100 - correctShare;
      const shares = [0, 1, 2, 3].map((index) => index === correct ? correctShare : Math.floor(remaining / 3));
      shares[(correct + 1) % 4] += 100 - shares.reduce((sum, value) => sum + value, 0);
      state.usedLifelines.add("audience");
      setStatusMessage(shares.map((value, index) => `${letters[index]} ${value}%`).join(" · "));
      playSound("lifeline");
      render();
    }

    function usePhone() {
      if (state.mode !== "question" || state.usedLifelines.has("phone") || state.answerShown) return;
      const correctLetter = letters[activeQuestions[state.questionIndex].correct];
      const moods = ["calmly says", "is leaning toward", "would lock"];
      state.usedLifelines.add("phone");
      setStatusMessage(`Phone helper ${moods[state.questionIndex % moods.length]} ${correctLetter}.`);
      playSound("lifeline");
      render();
    }

    function normalizeMedia(item, fallbackAlt) {
      if (!item) return null;
      if (typeof item === "string") return { src: item, alt: fallbackAlt };
      if (!item.src) return null;
      return {
        src: item.src,
        alt: item.alt || fallbackAlt,
        fit: item.fit || ""
      };
    }

    function normalizeQuestion(item) {
      if (!item || typeof item.question !== "string" || !Array.isArray(item.answers)) return null;
      const answers = item.answers.map((answer) => String(answer || "").trim()).slice(0, 4);
      const correct = Number(item.correct);

      if (!item.question.trim() || answers.length !== 4 || answers.some((answer) => !answer) || !Number.isInteger(correct) || correct < 0 || correct > 3) {
        return null;
      }

      return {
        question: item.question.trim(),
        answers,
        correct,
        promptMedia: (item.promptMedia || []).map((media, index) => normalizeMedia(media, `Question photo ${index + 1}`)).filter(Boolean),
        interludeMedia: (item.interludeMedia || item.resultMedia || []).map((media, index) => normalizeMedia(media, `Between-question photo ${index + 1}`)).filter(Boolean),
        interludeTitle: String(item.interludeTitle || "").trim(),
        interludeCaption: String(item.interludeCaption || "").trim()
      };
    }

    function loadCustomQuestions() {
      try {
        const raw = window.localStorage.getItem(customStorageKey);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        const items = Array.isArray(parsed) ? parsed : parsed.questions;
        if (!Array.isArray(items)) return [];
        return items.map(normalizeQuestion).filter(Boolean);
      } catch {
        return [];
      }
    }

    function saveCustomQuestions() {
      try {
        window.localStorage.setItem(customStorageKey, JSON.stringify(customQuestions));
      } catch {
        elements.studioJson.value = JSON.stringify({ questions: customQuestions }, null, 2);
        setStatusMessage("Draft storage is full. Export data to keep these changes.");
      }
    }

    function refreshActiveQuestions() {
      activeQuestions = [...questions, ...customQuestions];
      state.questionIndex = Math.min(state.questionIndex, activeQuestions.length - 1);
      renderCustomQuestionList();
      render();
    }

    function renderCustomQuestionList() {
      if (!studioEnabled) return;
      elements.customQuestionList.innerHTML = "";

      if (!customQuestions.length) {
        const empty = document.createElement("li");
        empty.textContent = "No local drafts.";
        elements.customQuestionList.appendChild(empty);
      } else {
        customQuestions.forEach((question, index) => {
          const item = document.createElement("li");
          const mediaCount = (question.promptMedia?.length || 0) + (question.interludeMedia?.length || 0);
          item.textContent = `${questions.length + index + 1}. ${question.question} · ${mediaCount} photos`;
          elements.customQuestionList.appendChild(item);
        });
      }

      elements.studioJson.value = JSON.stringify({ questions: customQuestions }, null, 2);
    }

    function readFileAsMedia(file, index, type) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({
          src: reader.result,
          alt: `${type} ${index + 1}`,
          fit: "fit-cover"
        });
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function readFilesAsMedia(fileList, type) {
      const files = Array.from(fileList || []);
      const media = await Promise.all(files.map((file, index) => readFileAsMedia(file, index, type)));
      return media.slice(0, 4);
    }

    function clearStudioForm() {
      elements.studioQuestion.value = "";
      elements.studioAnswerA.value = "";
      elements.studioAnswerB.value = "";
      elements.studioAnswerC.value = "";
      elements.studioAnswerD.value = "";
      elements.studioCorrect.value = "0";
      elements.studioPromptFiles.value = "";
      elements.studioInterludeFiles.value = "";
      elements.studioInterludeTitle.value = "";
    }

    async function addStudioQuestion() {
      const promptMedia = await readFilesAsMedia(elements.studioPromptFiles.files, "Question photo");
      const interludeMedia = await readFilesAsMedia(elements.studioInterludeFiles.files, "Between-question photo");
      const question = normalizeQuestion({
        question: elements.studioQuestion.value,
        answers: [
          elements.studioAnswerA.value,
          elements.studioAnswerB.value,
          elements.studioAnswerC.value,
          elements.studioAnswerD.value
        ],
        correct: Number(elements.studioCorrect.value),
        promptMedia,
        interludeMedia,
        interludeTitle: elements.studioInterludeTitle.value || "Bonus Content"
      });

      if (!question) {
        setStatusMessage("Fill in the question, four answers, and the correct option.");
        render();
        return;
      }

      customQuestions.push(question);
      saveCustomQuestions();
      clearStudioForm();
      setStatusMessage("Draft question added.");
      refreshActiveQuestions();
    }

    function exportStudioJson() {
      const json = JSON.stringify({ questions: customQuestions }, null, 2);
      elements.studioJson.value = json;
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "vipps-millionaire-questions.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    function importStudioJson() {
      try {
        const parsed = JSON.parse(elements.studioJson.value);
        const items = Array.isArray(parsed) ? parsed : parsed.questions;
        if (!Array.isArray(items)) throw new Error("Missing questions array");
        const normalized = items.map(normalizeQuestion).filter(Boolean);
        customQuestions = normalized;
        saveCustomQuestions();
        resetGame();
        setStatusMessage(`${customQuestions.length} draft questions loaded.`);
        refreshActiveQuestions();
      } catch {
        setStatusMessage("Could not import data.");
        render();
      }
    }

    function clearStudioQuestions() {
      customQuestions = [];
      saveCustomQuestions();
      resetGame();
      setStatusMessage("Local drafts cleared.");
      refreshActiveQuestions();
    }

    function setupStudio() {
      if (!studioEnabled) return;
      elements.studioButton.hidden = false;
      elements.studioPanel.hidden = false;
      elements.studioButton.addEventListener("click", () => {
        elements.studioPanel.hidden = !elements.studioPanel.hidden;
      });
      elements.studioAddButton.addEventListener("click", addStudioQuestion);
      elements.studioClearButton.addEventListener("click", clearStudioQuestions);
      elements.studioExportButton.addEventListener("click", exportStudioJson);
      elements.studioImportButton.addEventListener("click", importStudioJson);
      renderCustomQuestionList();
    }

    setupStudio();
    elements.soundButton.addEventListener("click", toggleSound);
    elements.revealButton.addEventListener("click", revealOption);
    elements.lockButton.addEventListener("click", lockAnswer);
    elements.answerButton.addEventListener("click", handleAnswerButton);
    elements.nextButton.addEventListener("click", nextQuestion);
    elements.resetButton.addEventListener("click", resetGame);
    elements.fiftyButton.addEventListener("click", useFiftyFifty);
    elements.audienceButton.addEventListener("click", useAudience);
    elements.phoneButton.addEventListener("click", usePhone);

    render();
  </script>
</body>
</html>
